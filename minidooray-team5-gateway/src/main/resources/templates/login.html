<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { border: 1px solid #ccc; padding: 20px; border-radius: 8px; background-color: #fff; max-width: 400px; margin: 40px auto; } /* 로그인 폼은 작게, 중앙에 */
        h2 { text-align: center; color: #333; }
        form div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 95%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="submit"] { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; font-size: 1em; width: 100%; } /* 버튼 100% */
        input[type="submit"]:hover { background-color: #0056b3; }
    </style>
</head>
<body>
<div class="container">
    <h2>Login</h2>
    <form method="post" th:action="@{/login/process}">
        <div>
            <label for="username-input">Username:</label>
            <input type="text" id="username-input" name="username" /><br />
        </div>
        <div>
            <label for="password-input">Password:</label>
            <input type="password" id="password-input" name="password" /><br />
        </div>

        <input type="submit" value="로그인" />
    </form>
</div>
</body>
</html>
